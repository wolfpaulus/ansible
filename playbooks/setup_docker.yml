# Description: This playbook is used to install docker and docker-compose on the target machine.
- name: Install docker
  hosts: beta
  become: true
  vars:
    packages:
      - nano
      - wget
      - htop
      - gnupg
  tasks:
    - name: Ensure packages are installed
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present

    - name: Add Docker GPG apt Key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['os_family'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      become: true

    - name: Add repository into sources list
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable"
        state: present
        update_cache: true
      become: true

    - name: Install docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true

    - name: Setup docker user
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Install Docker-Compose&Set Permission
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_facts["architecture"] }}
        dest: /usr/local/bin/docker-compose
        mode: "755"

    - name: Create Docker-Compose symlink
      ansible.builtin.command:
        cmd: ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose
        creates: /usr/bin/docker-compose

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
        enabled: true
