# Description: This playbook installs the DCA application on the alpha host.
- name: Install DCA Application
  hosts: apollo
  become: true
  tasks:
    - name: Install public Docker Container from GitHub Container Registry
      community.docker.docker_container:
        name: dca
        image: ghcr.io/wolfpaulus/dca:main
        labels:
          wud.watch.digest: "true"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8000:8000" # host port : container port
