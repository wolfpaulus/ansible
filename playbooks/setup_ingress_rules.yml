- name: Setup ingress rules for the artemis tunnel.
  hosts: artemis
  become: true
  tasks:
    - name: Create the config file for cloudflared and define the ingress rules for the beta tunnel
      ansible.builtin.copy:
        dest: "/etc/cloudflared/config.yml"
        content: |
          tunnel: {{ tunnel_id }}
          credentials-file: /etc/cloudflared/cred.json
          logfile: /var/log/cloudflared.log
          loglevel: warn
          ingress: # ingress rules for the tunnel
            - hostname: qdrant.{{ domain }}
              service: tcp://localhost:6333 # must be proxied using cloudflared on the client               
            - hostname: mongo.{{ domain }}
              service: tcp://localhost:27017 # must be proxied using cloudflared on the client          
            - hostname: mysql.{{ domain }}
              service: tcp://localhost:3306  # must be proxied using cloudflared on the client
            - hostname: ssh-{{ hostname }}  
              service: ssh://localhost:22    # must be proxied using cloudflared on the client
            - service: http_status:404
        mode: "0440"

    - name: Start the tunnel.
      ansible.builtin.service:
        name: cloudflared
        state: restarted
