# Purpose: Setup CNAMES for the tunnels.
# This will create AND map CNAMES to the tunnel IDs. 
# I.e., associates the CNAMES with host that will receive the traffic.
# It's not a problem, if the CNAMES already exist or are already mapped to the tunnel IDs.
- name: Setup CNAMES for the alpha tunnel.
  hosts: alpha
  become: true
  tasks:
    - name: Create CNAMES for the alpha tunnel. # put newest first
      ansible.builtin.shell: |
        cloudflared tunnel route dns "{{ tunnel_id }}" wordgame
        cloudflared tunnel route dns "{{ tunnel_id }}" dca
        cloudflared tunnel route dns "{{ tunnel_id }}" ssh-{{ hostname.split('.')[0] }}
        cloudflared tunnel route dns "{{ tunnel_id }}" {{ hostname.split('.')[0] }}
      register: my_output
      changed_when: my_output.rc != 0

