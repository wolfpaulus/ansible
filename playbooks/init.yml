# Description: Set timezone on all hosts and basic system configuration
- name: Set timezone
  hosts: alpha,beta
  become: "{{ ansible_become }}"
  tasks:
    - name: Set tz
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - sysstat
          - cifs-utils
          - avahi-daemon
          - avahi-discover
          - libnss-mdns
          - cloudflared
        state: present
        update_cache: true

    - name: Enable avahi-daemon
      ansible.builtin.systemd:
        name: avahi-daemon
        enabled: true
        state: started
