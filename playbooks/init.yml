# Description: Set timezone on all hosts and basic system configuration
- name: Set timezone
  hosts: alpha
  become: "{{ ansible_become }}"
  tasks:
    - name: Set tz
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - sysstat
          - cifs-utils
          - avahi-daemon
          - avahi-discover
          - libnss-mdns
        state: present
        update_cache: true

    - name: Enable avahi-daemon
      ansible.builtin.systemd:
        name: avahi-daemon
        enabled: true
        state: started

    - name: Download the cloudflared Linux package.
      shell: wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
    - name: Depackage cloudflared.
      shell: sudo dpkg -i cloudflared-linux-amd64.deb
